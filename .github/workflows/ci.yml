name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Guard hooks first: they enforce tenant isolation (I1) and the no-secret-logging
  # rule (I5). If a guard is silently broken, every later "the guard would have
  # caught it" claim in this run is worthless — so fail fast, before anything slow.
  guards:
    name: Guard hooks self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: '.nvmrc' }
      - run: node .claude/hooks/__selftest.mjs

  backend:
    name: Backend (Laravel 13 / PHP 8.3)
    runs-on: ubuntu-latest
    needs: guards
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnihear
          POSTGRES_PASSWORD: omnihear
          POSTGRES_DB: omnihear_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U omnihear"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, pcntl, posix, bcmath, intl, zip
          coverage: xdebug
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-progress
      # Same reason as the compose job: .env is gitignored. Without it 534 of the
      # 603 tests ran in a WARN state on file_get_contents(.env) and the job still
      # went green, because phpunit.xml had no failOnWarning. A green run has to
      # mean the same thing here as it does locally.
      - run: cp .env.example .env
      - run: composer check-platform-reqs
      # The branch this project sits on must stay advisory-clean. There is no
      # suppression block in composer.json (see ADR-0003) — if this fails, a real
      # advisory landed and needs a decision, not a silencer.
      - run: composer audit
      - run: vendor/bin/pint --test
      # The analyzer, running for real, so the live cross-service tests execute
      # instead of skipping. PROGRESS has carried this gap since F1: "three
      # defects survived a fully green gate because nothing in it connects two
      # services", and the first genuinely signed request between them returned
      # 401. Four tests were still skipping here as of run 33670011911.
      #
      # SENTIMENT_BACKEND=lexicon on purpose: these tests prove the contract —
      # HMAC over the raw bytes, the correlation id, the response shape — not
      # model quality, which the ai_service job covers with the real ONNX weights.
      # Fetching 171 MB of weights again here would buy nothing and cost minutes.
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Start the analyzer
        working-directory: ai-service
        env:
          AI_SERVICE_HMAC_SECRET: ci-only-not-a-real-secret
          SENTIMENT_BACKEND: lexicon
        run: |
          pip install -e ".[dev]"
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8001 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/health && break || sleep 1
          done
          curl -sf http://127.0.0.1:8001/health
      - name: Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: omnihear_test
          DB_USERNAME: omnihear
          DB_PASSWORD: omnihear
          AI_SERVICE_URL: http://127.0.0.1:8001
          AI_SERVICE_HMAC_SECRET: ci-only-not-a-real-secret
          CONTRACT_FIXTURES_PATH: ${{ github.workspace }}/contracts/fixtures/analyze
          REDIS_HOST: 127.0.0.1
        run: php artisan test --coverage --min=80

  ai_service:
    name: AI service (Python 3.12)
    runs-on: ubuntu-latest
    needs: guards
    defaults:
      run: { working-directory: ai-service }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: pip install -e ".[onnx,dev]"
      # Weights are a build artifact (ADR-0004), fetched here and SHA-256 pinned by
      # the script. Without them the ONNX path never runs in CI and 11 tests skip
      # silently — the sentiment engine the product actually ships would have no
      # coverage on the only machine that checks a clean tree.
      - name: Cache sentiment weights
        uses: actions/cache@v6
        with:
          path: ai-service/models
          key: sentiment-onnx-${{ hashFiles('ai-service/scripts/fetch_sentiment_model.py') }}
      - run: python -m scripts.fetch_sentiment_model --dest models/sentiment
      - run: ruff check .
      - run: ruff format --check .
      # -rs prints the reason for every skip, so a skip can never be invisible in
      # the log the way those eleven were.
      - run: pytest -rs

  # Node is pinned by .nvmrc rather than written here, because the two sides
  # disagreeing is not cosmetic: the lockfile is authored by whatever npm the
  # developer runs and validated by whatever npm CI runs. A lock written by npm 11
  # (Node 26) was rejected by npm 10 (Node 22) with "Missing: ... from lock file",
  # twice, for packages that were perfectly present locally.
  frontend:
    name: Frontend (Angular 22, zoneless)
    runs-on: ubuntu-latest
    needs: guards
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: '.nvmrc', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      # A dependency whose requirement the installed tree does not satisfy.
      # `npm ci` alone does not catch it: the Angular 18 tree carried an
      # unsatisfiable chokidar ^5 from angular-eslint for weeks, and the local
      # gate never ran a command that would have said so.
      - run: npm ls chokidar
      # Token gate. tokens-check runs its calibration assertions first and aborts
      # everything if the colour-blindness simulator cannot reproduce known cases
      # — an uncalibrated simulator once produced wrong numbers here (ADR-0006).
      - run: npm run tokens:check
      # i18n gate. Rule 5 compares the @@id count in source against the trans-unit
      # count in messages.xlf — 23 marked strings once existed with no extracted
      # units and nothing caught it.
      - run: npm run i18n:check
      # NOT `tsc -p tsconfig.app.json`: that config only checks files reachable from
      # src/main.ts, so anything not yet routed is skipped and it exits 0 anyway
      # (demonstrated with a deliberate type error). tsconfig.typecheck.json covers
      # all of src/.
      - run: npm run typecheck
      - run: npx eslint .
      - run: npx jest
      # Two thresholds, both derived from the measured framework floor (ADR-0007):
      # raw via angular.json, brotli transfer via the script. The script runs the
      # production build itself and refuses arguments, so the configuration cannot
      # be swapped; it also fails if angular.json's raw threshold and its own
      # constant disagree. Raising either needs the procedure in CLAUDE.md Trap 2.
      - run: npm run build:gate

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v7
      # compose declares `env_file: ../backend/.env`, which is gitignored, so on a
      # clean checkout `config` fails with "env file not found" — as this job did
      # the first time it ever ran. Creating it from the example is not a
      # workaround: it is the documented onboarding path, and running it here is
      # what proves .env.example still covers everything compose reads.
      - run: cp backend/.env.example backend/.env
      - run: docker compose -f infra/docker-compose.dev.yml config -q

  # The only job that runs the product instead of a piece of it: a real browser
  # against the Angular app, against Laravel, against the queue worker, against
  # the analyzer and against a real mailbox. It uses the same compose stack a
  # developer runs, deliberately — an E2E that passes against a CI-only topology
  # proves nothing about the stack anyone actually starts.
  #
  # The compose `frontend` service is NOT started: ng serve is run by Playwright's
  # webServer on the runner itself.
  e2e:
    name: E2E (Playwright, full stack)
    runs-on: ubuntu-latest
    needs: guards
    timeout-minutes: 30
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v7
      - name: Seed backend/.env
        working-directory: .
        run: cp backend/.env.example backend/.env
      - uses: actions/setup-node@v7
        with: { node-version-file: '.nvmrc', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      # Keyed on the resolved Playwright version, not a hand-written string: a
      # browser build is pinned to the package, and a stale cache is a silently
      # different browser.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
      # ai-service.Dockerfile downloads and SHA-256-verifies ~168 MB of ONNX
      # weights at build time (ADR-0004) via scripts/fetch_sentiment_model.py.
      # `docker compose ... up -d --build` below rebuilds every service it
      # names unconditionally, so without this the weights were re-fetched
      # from Hugging Face on every single push — which is what turned one
      # dropped connection into a failed build (CI run 33796748134).
      #
      # This caches the whole built image rather than the compose/buildx
      # layer cache: `docker compose build` on a plain (non-`docker-container`)
      # buildx driver — the default on a GitHub-hosted runner, and what
      # `up --build` uses here — does not accept `--cache-from`/`--cache-to`,
      # so it cannot consume the `type=gha,scope=ai-service` cache the
      # `docker` job below writes with `docker/build-push-action`. Verified
      # with `docker compose -f infra/docker-compose.dev.yml up --dry-run
      # --build ai-service`, and separately by tagging a throwaway image
      # `omnihear-ai-service:latest` and dry-running `up` on it *without*
      # `--build`: compose starts the existing image with no build step at
      # all, which is what the split below relies on.
      #
      # The cache key covers everything that ends up in the running image
      # (Dockerfile, dependency + app source, the fetch script's pins) but
      # deliberately not the rest of scripts/: multi-stage build discards
      # everything under /build except the venv, app/ and the weights, so a
      # change to e.g. train_category_model.py cannot affect this image and
      # must not bust the cache.
      - name: Cache ai-service image
        id: ai-service-image-cache
        uses: actions/cache@v6
        with:
          path: /tmp/ai-service-image.tar
          key: ai-service-image-${{ hashFiles('infra/docker/ai-service.Dockerfile', 'ai-service/pyproject.toml', 'ai-service/app/**', 'ai-service/scripts/fetch_sentiment_model.py') }}
      - name: Load cached ai-service image
        if: steps.ai-service-image-cache.outputs.cache-hit == 'true'
        working-directory: .
        run: docker load -i /tmp/ai-service-image.tar
      # Cache miss: build it once here (this is the only place a fresh
      # checkout ever re-fetches the weights) and save it so the next run
      # with unchanged inputs hits the branch above instead.
      - name: Build ai-service image (cache miss)
        if: steps.ai-service-image-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          docker compose -f infra/docker-compose.dev.yml build ai-service
          docker save omnihear-ai-service:latest -o /tmp/ai-service-image.tar
      # The three things a developer does once by hand and then never thinks
      # about again — which is exactly why a clean checkout is the only place
      # they surface.
      #
      # The stack bind-mounts ../backend, so vendor/ comes from the checkout and
      # a fresh one has none: `artisan` died on a missing autoload.php in
      # backend, horizon and reverb alike, and the stack never came up. APP_KEY
      # ships empty in .env.example. The postgres volume is new on every runner,
      # so there is no schema. None of this is visible locally, where all three
      # have been true since F2 — measured 2026-09-03, first push after W7.
      #
      # `--no-deps` on the first two: composer and key:generate need no
      # services, and starting postgres to run them would only slow the job. The
      # migrate run deliberately drops it, so compose brings up its dependencies
      # under their health conditions first.
      - name: Prepare the backend (vendor, key, schema)
        working-directory: .
        run: |
          C="docker compose -f infra/docker-compose.dev.yml"
          $C run --rm --no-deps --build backend composer install --prefer-dist --no-progress
          $C run --rm --no-deps backend php artisan key:generate --force
          $C run --rm backend php artisan migrate --force
      - name: Start the stack
        working-directory: .
        run: |
          # ai-service is deliberately left out of --build: it was already built
          # (cache hit) or just built (cache miss) above, and `up` without
          # --build uses that existing image as-is rather than rebuilding it.
          docker compose -f infra/docker-compose.dev.yml up -d ai-service
          docker compose -f infra/docker-compose.dev.yml up -d --build             postgres redis mailpit backend horizon reverb
      - name: Wait for the stack
        working-directory: .
        run: |
          for url in http://localhost:8000/api/health                      http://localhost:8001/health                      http://localhost:8025/api/v1/messages; do
            for i in $(seq 1 60); do
              curl -sf "$url" >/dev/null && break
              [ "$i" = 60 ] && { echo "::error::$url never came up";                 docker compose -f infra/docker-compose.dev.yml logs --tail=100; exit 1; }
              sleep 2
            done
            echo "ok $url"
          done
          docker compose -f infra/docker-compose.dev.yml ps
      - run: npx playwright test
      - name: Stack logs on failure
        if: failure()
        working-directory: .
        run: docker compose -f infra/docker-compose.dev.yml logs --tail=200
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Spec section 9 asks for a Docker build stage. It builds, it does not push:
  # there is no environment consuming these images, and publishing artifacts
  # nobody deploys would be ceremony rather than evidence (ADR-0010 records the
  # staging/production gap for the same reason). What this proves is real
  # regardless: that both Dockerfiles still build from a clean checkout, which
  # neither the compose job (config only) nor any other job checks.
  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: infra/docker/backend.Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      # Builds the ONNX weights in, so this is also the only place that proves the
      # fetch script and its SHA-256 pins still resolve.
      - name: AI service image
        uses: docker/build-push-action@v7
        with:
          context: ai-service
          file: infra/docker/ai-service.Dockerfile
          push: false
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service
