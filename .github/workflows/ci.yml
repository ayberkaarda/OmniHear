name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Guard hooks first: they enforce tenant isolation (I1) and the no-secret-logging
  # rule (I5). If a guard is silently broken, every later "the guard would have
  # caught it" claim in this run is worthless — so fail fast, before anything slow.
  guards:
    name: Guard hooks self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc' }
      - run: node .claude/hooks/__selftest.mjs

  backend:
    name: Backend (Laravel 13 / PHP 8.3)
    runs-on: ubuntu-latest
    needs: guards
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnihear
          POSTGRES_PASSWORD: omnihear
          POSTGRES_DB: omnihear_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U omnihear"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, pcntl, posix, bcmath, intl, zip
          coverage: xdebug
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-progress
      # Same reason as the compose job: .env is gitignored. Without it 534 of the
      # 603 tests ran in a WARN state on file_get_contents(.env) and the job still
      # went green, because phpunit.xml had no failOnWarning. A green run has to
      # mean the same thing here as it does locally.
      - run: cp .env.example .env
      - run: composer check-platform-reqs
      # The branch this project sits on must stay advisory-clean. There is no
      # suppression block in composer.json (see ADR-0003) — if this fails, a real
      # advisory landed and needs a decision, not a silencer.
      - run: composer audit
      - run: vendor/bin/pint --test
      - name: Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: omnihear_test
          DB_USERNAME: omnihear
          DB_PASSWORD: omnihear
          REDIS_HOST: 127.0.0.1
        run: php artisan test --coverage --min=80

  ai_service:
    name: AI service (Python 3.12)
    runs-on: ubuntu-latest
    needs: guards
    defaults:
      run: { working-directory: ai-service }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e ".[onnx,dev]"
      # Weights are a build artifact (ADR-0004), fetched here and SHA-256 pinned by
      # the script. Without them the ONNX path never runs in CI and 11 tests skip
      # silently — the sentiment engine the product actually ships would have no
      # coverage on the only machine that checks a clean tree.
      - name: Cache sentiment weights
        uses: actions/cache@v4
        with:
          path: ai-service/models
          key: sentiment-onnx-${{ hashFiles('ai-service/scripts/fetch_sentiment_model.py') }}
      - run: python -m scripts.fetch_sentiment_model --dest models/sentiment
      - run: ruff check .
      - run: ruff format --check .
      # -rs prints the reason for every skip, so a skip can never be invisible in
      # the log the way those eleven were.
      - run: pytest -rs

  # Node is pinned by .nvmrc rather than written here, because the two sides
  # disagreeing is not cosmetic: the lockfile is authored by whatever npm the
  # developer runs and validated by whatever npm CI runs. A lock written by npm 11
  # (Node 26) was rejected by npm 10 (Node 22) with "Missing: ... from lock file",
  # twice, for packages that were perfectly present locally.
  frontend:
    name: Frontend (Angular 22, zoneless)
    runs-on: ubuntu-latest
    needs: guards
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      # A dependency whose requirement the installed tree does not satisfy.
      # `npm ci` alone does not catch it: the Angular 18 tree carried an
      # unsatisfiable chokidar ^5 from angular-eslint for weeks, and the local
      # gate never ran a command that would have said so.
      - run: npm ls chokidar
      # Token gate. tokens-check runs its calibration assertions first and aborts
      # everything if the colour-blindness simulator cannot reproduce known cases
      # — an uncalibrated simulator once produced wrong numbers here (ADR-0006).
      - run: npm run tokens:check
      # i18n gate. Rule 5 compares the @@id count in source against the trans-unit
      # count in messages.xlf — 23 marked strings once existed with no extracted
      # units and nothing caught it.
      - run: npm run i18n:check
      # NOT `tsc -p tsconfig.app.json`: that config only checks files reachable from
      # src/main.ts, so anything not yet routed is skipped and it exits 0 anyway
      # (demonstrated with a deliberate type error). tsconfig.typecheck.json covers
      # all of src/.
      - run: npm run typecheck
      - run: npx eslint .
      - run: npx jest
      # Two thresholds, both derived from the measured framework floor (ADR-0007):
      # raw via angular.json, brotli transfer via the script. The script runs the
      # production build itself and refuses arguments, so the configuration cannot
      # be swapped; it also fails if angular.json's raw threshold and its own
      # constant disagree. Raising either needs the procedure in CLAUDE.md Trap 2.
      - run: npm run build:gate

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v4
      # compose declares `env_file: ../backend/.env`, which is gitignored, so on a
      # clean checkout `config` fails with "env file not found" — as this job did
      # the first time it ever ran. Creating it from the example is not a
      # workaround: it is the documented onboarding path, and running it here is
      # what proves .env.example still covers everything compose reads.
      - run: cp backend/.env.example backend/.env
      - run: docker compose -f infra/docker-compose.dev.yml config -q
