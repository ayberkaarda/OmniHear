@if (limit() !== null && remaining() !== null) {
  <div class="qm" [class.qm-compact]="compact()" [attr.data-level]="level()" data-testid="quota-meter">
    <p class="qm-line">
      @if (level() !== 'ok') {
        <span class="qm-icon"><app-icon [name]="levelIcon()" size="sm" /></span>
      }
      <span class="qm-title" i18n="@@shell.quota.title">Analyses</span>
      <span class="qm-num">{{ used() }}<span class="qm-of"> / {{ limit() }}</span></span>
    </p>

    <div
      class="qm-track"
      role="progressbar"
      [attr.aria-label]="meterLabel"
      [attr.aria-valuenow]="percentUsed()"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      <div class="qm-fill" [style.width.%]="percentUsed()"></div>
    </div>

    <p class="qm-rest">
      <span i18n="@@shell.quota.remaining">Remaining:</span>&ngsp;<span class="qm-rest-num">{{ remaining() }}</span>
    </p>
  </div>
}
