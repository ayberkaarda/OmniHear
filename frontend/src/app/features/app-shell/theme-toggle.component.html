<div class="tt" role="group" [attr.aria-label]="groupLabel" data-testid="theme-toggle">
  <button type="button" class="tt-opt" [attr.aria-pressed]="preference() === 'light'" (click)="select('light')">
    {{ lightLabel }}
  </button>
  <button type="button" class="tt-opt" [attr.aria-pressed]="preference() === 'dark'" (click)="select('dark')">
    {{ darkLabel }}
  </button>
  <button type="button" class="tt-opt" [attr.aria-pressed]="preference() === 'system'" (click)="select('system')">
    {{ systemLabel }}
  </button>
</div>
