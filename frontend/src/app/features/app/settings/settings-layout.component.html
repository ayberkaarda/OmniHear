<div class="st">
  <h1 class="st-title" i18n="@@app.settings.title">Settings</h1>

  <!-- Sections as text tabs, the same idiom as the views in the top bar; the
       marker lands on the one you are in. On a phone they scroll sideways. -->
  <nav class="st-tabs" [attr.aria-label]="navLabel">
    <a
      routerLink="/app/settings/profile"
      routerLinkActive="st-tab-on"
      #profile="routerLinkActive"
      [attr.aria-current]="profile.isActive ? 'page' : null"
      class="st-tab"
      ><span class="st-tab-text" i18n="@@app.settings.nav.profile">Profile</span></a
    >
    <a
      routerLink="/app/settings/team"
      routerLinkActive="st-tab-on"
      #team="routerLinkActive"
      [attr.aria-current]="team.isActive ? 'page' : null"
      class="st-tab"
      ><span class="st-tab-text" i18n="@@app.settings.nav.team">Team</span></a
    >
    <a
      routerLink="/app/settings/billing"
      routerLinkActive="st-tab-on"
      #billing="routerLinkActive"
      [attr.aria-current]="billing.isActive ? 'page' : null"
      class="st-tab"
      ><span class="st-tab-text" i18n="@@app.settings.nav.billing">Billing</span></a
    >
    <a
      routerLink="/app/settings/api-keys"
      routerLinkActive="st-tab-on"
      #apikeys="routerLinkActive"
      [attr.aria-current]="apikeys.isActive ? 'page' : null"
      class="st-tab"
      ><span class="st-tab-text" i18n="@@app.settings.nav.apiKeys">API keys</span></a
    >
    <a
      routerLink="/app/settings/notifications"
      routerLinkActive="st-tab-on"
      #notifications="routerLinkActive"
      [attr.aria-current]="notifications.isActive ? 'page' : null"
      class="st-tab"
      ><span class="st-tab-text" i18n="@@app.settings.nav.notifications">Notifications</span></a
    >
  </nav>

  <div class="st-body">
    <router-outlet />
  </div>
</div>
