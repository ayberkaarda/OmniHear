<div class="mx-auto flex w-full max-w-6xl flex-col gap-6">
  <h1 class="text-2xl font-semibold tracking-display text-[var(--text-primary)]" i18n="@@app.settings.title">Settings</h1>

  <!-- One strip of tabs under the title, lit with the same lamp as the rail.
       On a phone it scrolls sideways rather than wrapping. -->
  <nav class="-mx-4 flex gap-1 overflow-x-auto border-b border-[var(--border)] px-4 lg:mx-0 lg:px-0" [attr.aria-label]="navLabel">
    <a
      routerLink="/app/settings/profile"
      routerLinkActive=""
      #profile="routerLinkActive"
      [attr.aria-current]="profile.isActive ? 'page' : null"
      [class]="linkClasses(profile.isActive)"
      ><span i18n="@@app.settings.nav.profile">Profile</span
      ><span class="absolute inset-x-3 bottom-0 h-0.5 rounded-full bg-[var(--signal)]" [class.opacity-0]="!profile.isActive" aria-hidden="true"></span
    ></a>
    <a
      routerLink="/app/settings/team"
      routerLinkActive=""
      #team="routerLinkActive"
      [attr.aria-current]="team.isActive ? 'page' : null"
      [class]="linkClasses(team.isActive)"
      ><span i18n="@@app.settings.nav.team">Team</span
      ><span class="absolute inset-x-3 bottom-0 h-0.5 rounded-full bg-[var(--signal)]" [class.opacity-0]="!team.isActive" aria-hidden="true"></span
    ></a>
    <a
      routerLink="/app/settings/billing"
      routerLinkActive=""
      #billing="routerLinkActive"
      [attr.aria-current]="billing.isActive ? 'page' : null"
      [class]="linkClasses(billing.isActive)"
      ><span i18n="@@app.settings.nav.billing">Billing</span
      ><span class="absolute inset-x-3 bottom-0 h-0.5 rounded-full bg-[var(--signal)]" [class.opacity-0]="!billing.isActive" aria-hidden="true"></span
    ></a>
    <a
      routerLink="/app/settings/api-keys"
      routerLinkActive=""
      #apikeys="routerLinkActive"
      [attr.aria-current]="apikeys.isActive ? 'page' : null"
      [class]="linkClasses(apikeys.isActive)"
      ><span i18n="@@app.settings.nav.apiKeys">API keys</span
      ><span class="absolute inset-x-3 bottom-0 h-0.5 rounded-full bg-[var(--signal)]" [class.opacity-0]="!apikeys.isActive" aria-hidden="true"></span
    ></a>
    <a
      routerLink="/app/settings/notifications"
      routerLinkActive=""
      #notifications="routerLinkActive"
      [attr.aria-current]="notifications.isActive ? 'page' : null"
      [class]="linkClasses(notifications.isActive)"
      ><span i18n="@@app.settings.nav.notifications">Notifications</span
      ><span class="absolute inset-x-3 bottom-0 h-0.5 rounded-full bg-[var(--signal)]" [class.opacity-0]="!notifications.isActive" aria-hidden="true"></span
    ></a>
  </nav>

  <div class="min-w-0 max-w-3xl">
    <router-outlet />
  </div>
</div>
