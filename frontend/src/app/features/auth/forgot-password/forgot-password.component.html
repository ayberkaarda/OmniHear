<app-auth-layout [heading]="heading" [lead]="lead">
  @if (requested()) {
    <div
      class="rounded-md border border-[var(--sentiment-positive-border)] bg-[var(--sentiment-positive-bg)] p-4 text-sm text-[var(--sentiment-positive-text)]"
      role="status"
      data-testid="forgot-password-sent"
    >
      <p i18n="@@auth.forgot.sent">
        If that address belongs to an account, a reset link is on its way. The link is valid for a limited time.
      </p>
    </div>
  } @else {
    <form [formGroup]="form" class="flex flex-col gap-4" novalidate (ngSubmit)="onSubmit()">
      <app-input
        formControlName="email"
        type="email"
        [label]="emailLabel"
        [required]="true"
        prefixIcon="mail"
        [error]="errorFor('email')"
        (blurred)="onFieldBlur()"
      />

      <app-button type="submit" variant="primary" size="lg" [loading]="submitting()">
        <span i18n="@@auth.forgot.submit">Send reset link</span>
      </app-button>
    </form>
  }

  <p authFooter>
    <a
      routerLink="/auth/login"
      class="rounded-sm text-[var(--brand-text)] underline-offset-2 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--ring-focus)]"
      i18n="@@auth.forgot.backToLogin"
      >Back to sign in</a
    >
  </p>
</app-auth-layout>
