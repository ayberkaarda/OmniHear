<app-auth-layout [heading]="heading" [lead]="lead">
  <form [formGroup]="form" class="flex flex-col gap-4" novalidate (ngSubmit)="onSubmit()">
    <app-input
      formControlName="name"
      type="text"
      [label]="nameLabel"
      [required]="true"
      prefixIcon="user"
      [error]="errorFor('name')"
      (blurred)="onFieldBlur()"
    />

    <app-input
      formControlName="company_name"
      type="text"
      [label]="companyLabel"
      [required]="true"
      prefixIcon="tag"
      [error]="errorFor('company_name')"
      (blurred)="onFieldBlur()"
    />

    <app-input
      formControlName="email"
      type="email"
      [label]="emailLabel"
      [required]="true"
      prefixIcon="mail"
      [helper]="emailHelper"
      [error]="errorFor('email')"
      (blurred)="onFieldBlur()"
    />

    <app-input
      formControlName="password"
      type="password"
      [label]="passwordLabel"
      [required]="true"
      prefixIcon="lock"
      [helper]="passwordHelper"
      [error]="errorFor('password')"
      (blurred)="onFieldBlur()"
    />

    <app-input
      formControlName="password_confirmation"
      type="password"
      [label]="passwordConfirmationLabel"
      [required]="true"
      prefixIcon="lock"
      [error]="errorFor('password_confirmation')"
      (blurred)="onFieldBlur()"
    />

    <app-button type="submit" variant="primary" size="lg" [loading]="submitting()">
      <span i18n="@@auth.register.submit">Create account</span>
    </app-button>
  </form>

  <p authFooter>
    <span i18n="@@auth.register.haveAccount">Already have an account?</span>
    <a
      routerLink="/auth/login"
      class="rounded-sm text-[var(--brand-text)] underline-offset-2 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--ring-focus)]"
      i18n="@@auth.register.loginLink"
      >Sign in</a
    >
  </p>
</app-auth-layout>
