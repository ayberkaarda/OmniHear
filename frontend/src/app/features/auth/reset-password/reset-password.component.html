<app-auth-layout [heading]="heading" [lead]="lead">
  @if (linkIncomplete()) {
    <div
      class="rounded-md border border-[var(--sentiment-negative-border)] bg-[var(--sentiment-negative-bg)] p-4 text-sm text-[var(--sentiment-negative-text)]"
      role="status"
      data-testid="reset-link-incomplete"
    >
      <p i18n="@@auth.reset.linkIncomplete">
        This reset link is incomplete. Open the most recent link from your email, or request a new one.
      </p>
    </div>
  } @else {
    <form [formGroup]="form" class="flex flex-col gap-4" novalidate (ngSubmit)="onSubmit()">
      <app-input
        formControlName="email"
        type="email"
        [label]="emailLabel"
        [required]="true"
        prefixIcon="mail"
        [error]="errorFor('email')"
        (blurred)="onFieldBlur()"
      />

      <app-input
        formControlName="password"
        type="password"
        [label]="passwordLabel"
        [required]="true"
        prefixIcon="lock"
        [helper]="passwordHelper"
        [error]="errorFor('password')"
        (blurred)="onFieldBlur()"
      />

      <app-input
        formControlName="password_confirmation"
        type="password"
        [label]="passwordConfirmationLabel"
        [required]="true"
        prefixIcon="lock"
        [error]="errorFor('password_confirmation')"
        (blurred)="onFieldBlur()"
      />

      <app-button type="submit" variant="primary" size="lg" [loading]="submitting()">
        <span i18n="@@auth.reset.submit">Save new password</span>
      </app-button>
    </form>
  }

  <p authFooter>
    <a
      routerLink="/auth/forgot-password"
      class="rounded-sm text-[var(--brand-text)] underline-offset-2 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--ring-focus)]"
      i18n="@@auth.reset.requestAgain"
      >Request a new link</a
    >
  </p>
</app-auth-layout>
