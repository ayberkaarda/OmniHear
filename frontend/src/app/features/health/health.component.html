<main id="main-content" class="status-page">
  <header class="page-masthead"><app-logo variant="full" /></header>
  <section class="health-layout" aria-labelledby="health-title">
    <h1 id="health-title" i18n="@@health.title">OmniHear system status</h1>
    <div class="health-reading" role="status" aria-live="polite" aria-atomic="true" [attr.aria-busy]="state() === 'loading'">
      @switch (state()) {
        @case ('loading') {
          <span class="status-lamp pending" aria-hidden="true"></span>
          <p data-testid="health-loading" i18n="@@health.loading">Checking system status…</p>
        }
        @case ('success') {
          <span class="status-lamp healthy" aria-hidden="true"></span>
          <p class="healthy-text" data-testid="health-success" i18n="@@health.success">System is healthy: {{ status() }}</p>
        }
        @case ('error') {
          <span class="status-lamp unavailable" aria-hidden="true"></span>
          <p class="error-text" data-testid="health-error" i18n="@@health.error">Unable to reach the system. Please try again later.</p>
        }
      }
    </div>
  </section>
</main>
