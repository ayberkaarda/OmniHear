<main class="flex min-h-screen flex-col items-center justify-center gap-4 bg-[var(--bg-canvas)] px-4 text-center">
  <p class="font-mono text-sm tracking-widest text-[var(--text-muted)]" aria-hidden="true">404</p>
  <h1 class="text-2xl font-semibold text-[var(--text-primary)]" i18n="@@notFound.title">This page does not exist</h1>
  <p class="max-w-prose text-sm text-[var(--text-secondary)]" i18n="@@notFound.body">
    The address you followed may be out of date, or the page may have been moved.
  </p>
  <a routerLink="/" appButtonStyle variant="secondary" i18n="@@notFound.backHome">Back to the home page</a>
</main>
