<main id="main-content" class="status-page">
  <header class="page-masthead"><app-logo variant="full" /></header>
  <section class="missing-page" aria-labelledby="not-found-title">
    <div class="missing-code" aria-hidden="true"><span>404</span><div class="broken-line"></div></div>
    <div class="missing-copy">
      <h1 id="not-found-title" i18n="@@notFound.title">This page does not exist</h1>
      <p i18n="@@notFound.body">
        The address you followed may be out of date, or the page may have been moved.
      </p>
      <a routerLink="/" appButtonStyle variant="secondary" size="lg" i18n="@@notFound.backHome">Back to the home page</a>
    </div>
  </section>
</main>
