<button
  [type]="type()"
  [class]="classes()"
  [disabled]="isDisabled()"
  [attr.aria-busy]="loading() ? 'true' : null"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.data-variant]="variant()"
  (click)="onClick($event)"
>
  @if (loading()) {
    <span class="ui-btn-wave" data-testid="button-spinner" aria-hidden="true"><i></i><i></i><i></i></span>
  }
  <!-- Hidden by paint only (not visibility/display), so the label still names the button while it is busy. -->
  <span class="ui-btn-label" [class.opacity-0]="loading()" data-testid="button-label">
    <ng-content></ng-content>
  </span>
</button>
