<div
  class="flex flex-col items-center gap-1.5 rounded-card border border-[var(--border)] bg-[var(--bg-surface)] px-6 py-12 text-center"
  data-testid="empty-state"
>
  <span
    class="mb-2.5 flex h-10 w-10 items-center justify-center rounded-control border border-[var(--border)] bg-[var(--bg-surface-sunken)] text-[var(--text-muted)]"
  >
    <app-icon [name]="icon()" size="lg" />
  </span>
  <p class="text-base font-semibold leading-6 text-[var(--text-primary)]">{{ heading() }}</p>
  @if (description()) {
    <p class="max-w-[52ch] text-sm leading-5 text-[var(--text-secondary)]">{{ description() }}</p>
  }
  <div class="mt-3 flex flex-wrap items-center justify-center gap-2 empty:hidden">
    <ng-content></ng-content>
  </div>
</div>
