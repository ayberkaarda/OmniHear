<div class="es" data-testid="empty-state">
  <span class="es-mark" aria-hidden="true">
    <app-icon [name]="icon()" size="lg" />
  </span>
  <div class="es-copy">
    <p class="es-title">{{ heading() }}</p>
    @if (description()) {
      <p class="es-desc">{{ description() }}</p>
    }
    <div class="es-actions">
      <ng-content></ng-content>
    </div>
  </div>
</div>
