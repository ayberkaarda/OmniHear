<div class="flex flex-col gap-1.5">
  <label [for]="fieldId" [class]="labelClasses">
    {{ label() }}
    @if (required()) {
      <span class="ml-0.5 text-[var(--status-error)]" aria-hidden="true">*</span>
    }
  </label>

  <div class="relative flex items-center">
    @if (prefixIconName()) {
      <span class="pointer-events-none absolute left-3 flex items-center text-[var(--text-muted)]">
        <app-icon [name]="prefixIconName()!" size="sm" />
      </span>
    }

    <input
      [id]="fieldId"
      [type]="type()"
      [class]="inputClasses()"
      [value]="value() ?? ''"
      [disabled]="isDisabled"
      [required]="required()"
      [attr.autocomplete]="autocomplete() ?? null"
      [attr.inputmode]="inputMode() ?? null"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (input)="onInput($event)"
      (blur)="handleBlur()"
    />

    @if (suffixIconName()) {
      <span class="pointer-events-none absolute right-3 flex items-center text-[var(--text-muted)]">
        <app-icon [name]="suffixIconName()!" size="sm" />
      </span>
    }
  </div>

  @if (error()) {
    <p [id]="errorId" [class]="errorClasses">
      <app-icon class="mt-px" name="alert-triangle" size="sm" />
      <span>{{ error() }}</span>
    </p>
  } @else if (helper()) {
    <p [id]="helperId" [class]="helperClasses">{{ helper() }}</p>
  }
</div>
