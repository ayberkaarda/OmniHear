<div class="ff">
  <label [for]="fieldId" class="ff-label">
    {{ label() }}
    @if (required()) {
      <span class="ff-req" aria-hidden="true">*</span>
    }
  </label>

  <div class="ff-box">
    @if (prefixIconName()) {
      <span class="ff-icon">
        <app-icon [name]="prefixIconName()!" size="sm" />
      </span>
    }

    <input
      [id]="fieldId"
      [type]="type()"
      [class]="inputClasses()"
      [value]="value() ?? ''"
      [disabled]="isDisabled"
      [required]="required()"
      [attr.autocomplete]="autocomplete() ?? null"
      [attr.inputmode]="inputMode() ?? null"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (input)="onInput($event)"
      (blur)="handleBlur()"
    />

    @if (suffixIconName()) {
      <span class="ff-icon ff-icon--end">
        <app-icon [name]="suffixIconName()!" size="sm" />
      </span>
    }
  </div>

  @if (error()) {
    <p [id]="errorId" class="ff-error">
      <app-icon name="alert-triangle" size="sm" />
      <span>{{ error() }}</span>
    </p>
  } @else if (helper()) {
    <p [id]="helperId" class="ff-help">{{ helper() }}</p>
  }
</div>
