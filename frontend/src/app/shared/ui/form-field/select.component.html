<div class="ff">
  <label [for]="fieldId" class="ff-label">
    {{ label() }}
    @if (required()) {
      <span class="ff-req" aria-hidden="true">*</span>
    }
  </label>

  <div class="ff-box">
    @if (prefixIconName()) {
      <span class="ff-icon">
        <app-icon [name]="prefixIconName()!" size="sm" />
      </span>
    }

    <select
      [id]="fieldId"
      [class]="selectClasses()"
      [disabled]="isDisabled"
      [required]="required()"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      [value]="value() ?? ''"
      (change)="onSelectChange($event)"
      (blur)="handleBlur()"
    >
      @if (placeholder()) {
        <option value="" disabled>{{ placeholder() }}</option>
      }
      @for (option of options(); track option.value) {
        <option [value]="option.value" [disabled]="option.disabled ?? false">{{ option.label }}</option>
      }
    </select>

    <span class="ff-icon ff-icon--end">
      <app-icon name="chevron-down" size="sm" />
    </span>
  </div>

  @if (error()) {
    <p [id]="errorId" class="ff-error">
      <app-icon name="alert-triangle" size="sm" />
      <span>{{ error() }}</span>
    </p>
  } @else if (helper()) {
    <p [id]="helperId" class="ff-help">{{ helper() }}</p>
  }
</div>
