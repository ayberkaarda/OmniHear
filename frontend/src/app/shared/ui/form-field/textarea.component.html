<div class="flex flex-col gap-1.5">
  <label [for]="fieldId" [class]="labelClasses">
    {{ label() }}
    @if (required()) {
      <span class="ml-0.5 text-[var(--status-error)]" aria-hidden="true">*</span>
    }
  </label>

  <textarea
    [id]="fieldId"
    [rows]="rows()"
    [class]="textareaClasses()"
    [disabled]="isDisabled"
    [required]="required()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($event)"
    (blur)="handleBlur()"
    >{{ value() ?? '' }}</textarea
  >

  @if (error()) {
    <p [id]="errorId" [class]="errorClasses">
      <app-icon class="mt-px" name="alert-triangle" size="sm" />
      <span>{{ error() }}</span>
    </p>
  } @else if (helper()) {
    <p [id]="helperId" [class]="helperClasses">{{ helper() }}</p>
  }
</div>
