<div class="ff">
  <label [for]="fieldId" class="ff-label">
    {{ label() }}
    @if (required()) {
      <span class="ff-req" aria-hidden="true">*</span>
    }
  </label>

  <textarea
    [id]="fieldId"
    [rows]="rows()"
    [class]="textareaClasses()"
    [disabled]="isDisabled"
    [required]="required()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($event)"
    (blur)="handleBlur()"
    >{{ value() ?? '' }}</textarea
  >

  @if (error()) {
    <p [id]="errorId" class="ff-error">
      <app-icon name="alert-triangle" size="sm" />
      <span>{{ error() }}</span>
    </p>
  } @else if (helper()) {
    <p [id]="helperId" class="ff-help">{{ helper() }}</p>
  }
</div>
