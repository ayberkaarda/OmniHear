<div class="flex flex-col gap-1">
  <label [for]="fieldId" class="text-sm font-medium text-[var(--text-primary)]">
    {{ label() }}
    @if (required()) {
      <span class="text-[var(--sentiment-negative-text)]" aria-hidden="true">*</span>
    }
  </label>

  <textarea
    [id]="fieldId"
    [rows]="rows()"
    [class]="textareaClasses()"
    [disabled]="isDisabled"
    [required]="required()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($event)"
    (blur)="handleBlur()"
    >{{ value() ?? '' }}</textarea
  >

  @if (error()) {
    <p [id]="errorId" class="text-xs text-[var(--sentiment-negative-text)]">{{ error() }}</p>
  } @else if (helper()) {
    <p [id]="helperId" class="text-xs text-[var(--text-muted)]">{{ helper() }}</p>
  }
</div>
