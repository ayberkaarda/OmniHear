<button
  type="button"
  class="flex w-full flex-col gap-3 rounded-card border border-[var(--border)] bg-[var(--bg-surface)] p-4 text-left transition-[color,background-color,border-color,box-shadow,transform] duration-fast ease-standard hover:bg-[var(--bg-surface-hover)] enabled:active:translate-y-px focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--ring-focus)] focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--bg-surface)] kpi"
  [disabled]="isSkeleton()"
  [attr.aria-busy]="loading() ? 'true' : null"
  (click)="onActivate()"
>
  <span class="truncate text-sm font-medium leading-5 text-[var(--text-secondary)]">{{ title() }}</span>

  <span class="kpi-row flex items-end justify-between gap-4">
    @if (isSkeleton()) {
      <span class="mb-1 h-6 w-24 animate-pulse rounded bg-[var(--bg-surface-sunken)]" data-testid="kpi-skeleton"></span>
    } @else {
      <span class="kpi-value kpi-num font-semibold tracking-display text-[var(--text-primary)]">{{ displayValue() }}</span>
    }

    @if (!isSkeleton() && sparkPoints()) {
      <svg
        [attr.viewBox]="sparkViewBox"
        class="kpi-spark mb-1 w-24 shrink-0 text-[var(--text-muted)]"
        preserveAspectRatio="none"
        aria-hidden="true"
        focusable="false"
      >
        <polyline
          [attr.points]="sparkPoints()"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          vector-effect="non-scaling-stroke"
        />
      </svg>
    }
  </span>

  @if (!isSkeleton() && (formattedDelta() || deltaLabel())) {
    <span class="kpi-foot flex flex-wrap items-center text-xs leading-4">
      @if (formattedDelta()) {
        <span class="inline-flex items-center gap-0.5 font-medium" [class]="deltaToneClass()">
          @if (deltaIcon()) {
            <app-icon [name]="deltaIcon()!" size="sm" />
          }
          <span class="kpi-num">{{ formattedDelta() }}</span>
        </span>
      }
      @if (deltaLabel()) {
        <span class="text-[var(--text-muted)]">{{ deltaLabel() }}</span>
      }
      @switch (deltaTone()) {
        @case ('positive') {
          <span class="sr-only" i18n="Screen-reader only KPI delta direction@@kpiCard.delta.increase">Increased</span>
        }
        @case ('negative') {
          <span class="sr-only" i18n="Screen-reader only KPI delta direction@@kpiCard.delta.decrease">Decreased</span>
        }
      }
    </span>
  }
</button>
