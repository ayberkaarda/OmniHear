<button
  type="button"
  class="kpi"
  [disabled]="isSkeleton()"
  [attr.aria-busy]="loading() ? 'true' : null"
  (click)="onActivate()"
>
  <span class="kpi-title">{{ title() }}</span>

  <span class="kpi-row">
    @if (isSkeleton()) {
      <span class="kpi-skel animate-pulse" data-testid="kpi-skeleton"></span>
    } @else {
      <span class="kpi-value">{{ displayValue() }}</span>
    }

    @if (!isSkeleton() && sparkBars(); as bars) {
      <span class="kpi-spark" aria-hidden="true">
        @for (bar of bars; track $index; let last = $last) {
          <i [style.height.%]="bar" [class.is-now]="last"></i>
        }
      </span>
    }
  </span>

  @if (!isSkeleton() && (formattedDelta() || deltaLabel())) {
    <span class="kpi-foot">
      @if (formattedDelta()) {
        <span class="kpi-delta" [attr.data-tone]="deltaTone()">
          @if (deltaIcon()) {
            <app-icon [name]="deltaIcon()!" size="sm" />
          }
          <span>{{ formattedDelta() }}</span>
        </span>
      }
      @if (deltaLabel()) {
        <span class="kpi-label">{{ deltaLabel() }}</span>
      }
      @switch (deltaTone()) {
        @case ('positive') {
          <span class="sr-only" i18n="Screen-reader only KPI delta direction@@kpiCard.delta.increase">Increased</span>
        }
        @case ('negative') {
          <span class="sr-only" i18n="Screen-reader only KPI delta direction@@kpiCard.delta.decrease">Decreased</span>
        }
      }
    </span>
  }
</button>
