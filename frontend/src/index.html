<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f1f3f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101210" media="(prefers-color-scheme: dark)">

  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OmniHear">
  <meta property="og:title" content="OmniHear: every voice, one inbox">
  <meta property="og:description" content="Customer feedback from six channels in one list, each comment read, scored and sorted.">
  <meta property="og:image" content="/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="OmniHear: every voice, one inbox">
  <meta name="twitter:description" content="Customer feedback from six channels in one list, each comment read, scored and sorted.">
  <meta name="twitter:image" content="/og-image.png">

  <!--
    No third-party font host. IBM Plex used to be pulled from
    fonts.googleapis.com, which handed every visitor's IP address to a third
    party before they had consented to anything (KVKK; docs/PROGRESS.md carried
    this as a known deviation). The faces are now declared in
    src/styles/fonts.css and served from this origin (the build emits them as
    hashed files under media/).
  -->

  <script>
    // FOUC guard: resolve the theme class before first paint, mirroring
    // ThemeService's resolution logic (light/dark/system). Must run before
    // any stylesheet-dependent paint, and must not throw if storage/matchMedia
    // are unavailable (private browsing, etc).
    (function () {
      try {
        var STORAGE_KEY = 'omnihear.theme';
        var stored = window.localStorage ? window.localStorage.getItem(STORAGE_KEY) : null;
        var preference = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
        var isDark = preference === 'dark';
        if (preference === 'system' && window.matchMedia) {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        // Ignore: worst case is a light-theme first paint that ThemeService corrects.
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
