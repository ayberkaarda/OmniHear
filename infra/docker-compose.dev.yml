# OmniHear — development stack.
#
# Run from the repository root:
#   docker compose -f infra/docker-compose.dev.yml up -d
#
# The host toolchain is NOT authoritative. Spec §2 fixes PHP 8.3,
# Python 3.12 and PostgreSQL 16; these images pin exactly that, so the
# regression gate run inside containers is what proves compliance.
#
# WARNING: `docker compose down -v` destroys the postgres volume, taking
# the dev database with it (integrations.credentials included). Plain
# `down` stops containers and keeps the data.

name: omnihear

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omnihear
      POSTGRES_PASSWORD: omnihear
      POSTGRES_DB: omnihear
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates omnihear_test alongside omnihear on first initialisation.
      - ./postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnihear -d omnihear"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: ../ai-service
      dockerfile: ../infra/docker/ai-service.Dockerfile
    environment:
      AI_SERVICE_HMAC_SECRET: ${AI_SERVICE_HMAC_SECRET:-dev-only-not-a-real-secret}
      MODEL_VERSION: ${MODEL_VERSION:-stub-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8001:8001"

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      AI_SERVICE_URL: http://ai-service:8001
      # Same value as the ai-service below. compose `environment` overrides
      # `env_file`, so backend/.env cannot drift out of sync with the analyzer.
      AI_SERVICE_HMAC_SECRET: ${AI_SERVICE_HMAC_SECRET:-dev-only-not-a-real-secret}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      # No named volume over vendor/: an empty one shadows the host directory and
      # artisan dies on a missing autoload.php. vendor/ is installed from the 8.3
      # container anyway, so the bind mount is the correct source.
      - ../backend:/srv/backend
      # The Laravel↔FastAPI contract test reads contracts/fixtures/analyze/ — the
      # same files ai-service/tests/test_contract_fixtures.py reads. Without this
      # mount the directory does not exist inside the container and the invariant
      # I7 tests silently skip, which is the one outcome a contract test must not
      # have. Read-only: the backend consumes these fixtures, it never writes them.
      - ../contracts:/srv/contracts:ro

  horizon:
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    command: ["php", "artisan", "horizon"]
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      AI_SERVICE_URL: http://ai-service:8001
      # Same value as the ai-service below. compose `environment` overrides
      # `env_file`, so backend/.env cannot drift out of sync with the analyzer.
      AI_SERVICE_HMAC_SECRET: ${AI_SERVICE_HMAC_SECRET:-dev-only-not-a-real-secret}
    depends_on:
      backend:
        condition: service_started
    volumes:
      # No named volume over vendor/: an empty one shadows the host directory and
      # artisan dies on a missing autoload.php. vendor/ is installed from the 8.3
      # container anyway, so the bind mount is the correct source.
      - ../backend:/srv/backend

  reverb:
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      # Reverb does not call the analyzer today, but leaving the placeholder from
      # backend/.env in place here is the same footgun that produced a 401 between
      # backend and ai-service: one service silently holding a different secret.
      AI_SERVICE_HMAC_SECRET: ${AI_SERVICE_HMAC_SECRET:-dev-only-not-a-real-secret}
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_started
    volumes:
      # No named volume over vendor/: an empty one shadows the host directory and
      # artisan dies on a missing autoload.php. vendor/ is installed from the 8.3
      # container anyway, so the bind mount is the correct source.
      - ../backend:/srv/backend

  frontend:
    image: node:22-alpine
    working_dir: /srv/frontend
    command: ["npx", "ng", "serve", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      NG_CLI_ANALYTICS: "false"
    ports:
      - "4200:4200"
    volumes:
      # Same reasoning as backend/vendor: an empty named volume would hide
      # the installed node_modules and ng serve would fail.
      - ../frontend:/srv/frontend

volumes:
  postgres-data:
  redis-data:
